<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI配置 - 交易决策中心</title>
  <link rel="stylesheet" href="/static/ui/nav.css">
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#1f2937;min-height:100vh}.app-shell{max-width:1520px;margin:0 auto;padding:24px;display:grid;grid-template-columns:280px 1fr;gap:20px}.sidebar,.header,.card,.panel,.record-card,.score-card,.config-card{background:rgba(255,255,255,.96);border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.12);backdrop-filter:blur(8px)}.header{padding:24px;margin-bottom:20px}.header h2{margin:0 0 8px;font-size:30px;color:#111827}.header p{margin:0;color:#6b7280;line-height:1.6}.score-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.score-card{padding:16px;color:#fff;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%)}.score-card h3{margin:0 0 10px;font-size:13px;font-weight:600;opacity:.92}.score-value{font-size:28px;font-weight:800}.score-meta{margin-top:4px;font-size:12px;opacity:.9}.panel{padding:20px;margin-bottom:20px}.panel h3,.content h3{margin:0 0 16px;font-size:20px;color:#111827}.config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.config-card{padding:18px}.config-card-header h3{margin:0 0 14px;font-size:18px}.config-table{width:100%;border-collapse:collapse}.config-table th,.config-table td{padding:12px 10px;border-bottom:1px solid #eef2f7;vertical-align:top;text-align:left}.config-table th{width:220px;font-size:13px;color:#475569}.json-block{margin:0;white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.6;color:#334155;background:#f8fafc;border-radius:12px;padding:14px}.tips{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tip-box{padding:16px;border-radius:14px;background:#f8fafc;border:1px solid #e5e7eb}.tip-box h4{margin:0 0 8px;font-size:15px}.tip-box p{margin:0;color:#6b7280;line-height:1.7}.config-error{margin:0;color:#b91c1c}.error-card{border:1px solid #fecaca}@media (max-width:1280px){.app-shell{grid-template-columns:1fr}.score-grid,.config-grid,.tips{grid-template-columns:1fr 1fr}}@media (max-width:720px){.score-grid,.config-grid,.tips{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-page="ai-config"></aside>
    <main>
      <div class="header"><h2>AI配置</h2><p>读取当前系统 `config.json` 中的 `ai` 配置段，集中查看模型、温度、Token 上限、基础地址和密钥掩码信息。</p></div>
      <div class="score-grid">
        <div class="score-card"><h3>配置来源</h3><div class="score-value">config.json</div><div class="score-meta">实时读取</div></div>
        <div class="score-card"><h3>配置范围</h3><div class="score-value">ai</div><div class="score-meta">仅展示 AI 段</div></div>
        <div class="score-card"><h3>敏感字段</h3><div class="score-value">已掩码</div><div class="score-meta">api_key 不明文展示</div></div>
        <div class="score-card"><h3>使用场景</h3><div class="score-value">模型链路</div><div class="score-meta">分析与推理调用</div></div>
      </div>
      <section class="panel"><h3>AI 配置明细</h3><div class="config-grid" data-config-scope="ai"></div></section>
      <section class="panel"><h3>使用说明</h3><div class="tips"><div class="tip-box"><h4>配置定位</h4><p>此页只展示 `config.json` 的 `ai` 顶层段，方便单独核对模型平台、模型名称和推理参数。</p></div><div class="tip-box"><h4>安全说明</h4><p>接口返回前会对 `api_key` 做掩码处理，页面不会直接输出真实敏感值。</p></div></div></section>
      <section class="panel"><h3>原始返回预览</h3><div data-config-raw></div></section>
    </main>
  </div>
  <script src="/static/ui/nav.js"></script>
  <script src="/static/ui/config_pages.js"></script>
</body>
</html>
