<body><div class="app-shell"><aside class="sidebar" data-page="batch-analysis"></aside><main><div class="header"><h2>批量分析</h2><p>这是面向老版本批量分析能力的新风格兼容页面，用于统一承接批量输入、批量分析和结果汇总，不修改旧版一体化页面功能。</p></div><div class="score-grid"><div class="score-card"><h3>待分析股票</h3><div class="score-value">15</div><div class="score-meta">本次任务</div></div><div class="score-card"><h3>完成数量</h3><div class="score-value">11</div><div class="score-meta">最近一次执行</div></div><div class="score-card"><h3>优先标的</h3><div class="score-value">4</div><div class="score-meta">建议进入关注池</div></div><div class="score-card"><h3>兼容说明</h3><div class="score-value">旧能力保留</div><div class="score-meta">不改原流程</div></div></div><section class="panel"><h3>批量分析参数</h3><div class="panel-grid"><div class="form-group"><label>股票列表</label><input class="form-control" value="300750, 601088, 688981"></div><div class="form-group"><label>分析类型</label><select class="form-control"><option>综合分析</option></select></div><div class="form-group"><label>模型</label><select class="form-control"><option>qwen3.5-n</option></select></div><div class="form-group"><label>输出数量</label><select class="form-control"><option>前 20 条</option></select></div><button class="btn">开始批量分析</button><button class="btn-light">查看旧批量入口</button></div></section><div class="content"><section class="section card"><h3>能力映射说明</h3><div class="grid-2"><div class="form-group"><label>新页面职责</label><textarea>统一承接批量分析的参数录入、结果概览和执行记录查看，保证与当前系统风格一致。</textarea></div><div class="form-group"><label>旧能力现状</label><textarea>老版本一体化页面中已有批量分析入口，但当前项目 src 路由中未看到对应新注册页面，因此此处先做兼容壳页。</textarea></div></div><div class="grid-2"><div class="form-group"><label>结果输出示例</label><textarea>输出候选股票的综合结论、风险排序和建议动作，便于批量收敛到关注列表。</textarea></div><div class="form-group"><label>后续动作</label><textarea>批量分析结果可进一步转入选股策略筛选或单股分析页做精细化研究。</textarea></div></div></section><section class="section"><h3>批量分析历史记录</h3><div class="record-grid"><div class="record-card"><h4>批量分析 #BA-20260425-002</h4><div class="record-meta">分析 15 只 · 输出 4 个优先标
