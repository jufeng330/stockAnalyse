  <style>
    *{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#1f2937;min-height:100vh}

    .panel{padding:20px;margin-bottom:20px}.panel h3,.content h3{margin:0 0 16px;font-size:20px;color:#111827}.panel-grid{display:grid;grid-template-columns:1.2fr repeat(3,minmax(0,1fr)) auto auto;gap:12px;align-items:end}.form-group{margin-bottom:16px}.panel-grid .form-group{margin-bottom:0}.form-group label{display:block;margin-bottom:8px;font-weight:600;color:#374151}.form-control,textarea,select{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;background:#fff}textarea{min-height:120px;resize:vertical}.btn,.btn-light{border:none;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn{width:100%;color:#fff;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%)}.btn-light{width:100%;color:#374151;background:#f3f4f6;border:1px solid #e5e7eb}
    .section{margin-bottom:20px}.card{padding:18px}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.record-card{padding:18px}.record-card h4{margin:0 0 8px;font-size:16px}.record-meta{color:#6b7280;font-size:13px;line-height:1.7}
    @media (max-width:1280px){.app-shell{grid-template-columns:1fr}.sidebar{position:static;min-height:auto}.score-grid,.grid-2,.record-grid,.panel-grid{grid-template-columns:1fr 1fr}} @media (max-width:720px){.score-grid,.grid-2,.record-grid,.panel-grid{grid-template-columns:1fr}}

  <div class="app-shell">
    <aside class="sidebar" data-page="holding-review"></aside>
    <main>
      <div class="header"><h2>持仓复盘</h2><p>用于对单只持仓进行一次通用复盘，重新校验买入逻辑、当前执行质量、风险变化和后续动作建议。</p></div>
      <div class="score-grid"><div class="score-card"><h3>当前标的</h3><div class="score-value">宁德时代</div><div class="score-meta">300750 · B 阶段</div></div><div class="score-card"><h3>持有收益</h3><div class="score-value">+3.17%</div><div class="score-meta">仓位 9.6%</div></div><div class="score-card"><h3>复盘结论</h3><div class="score-value">继续持有</div><div class="score-meta">等待第二笔条件</div></div><div class="score-card"><h3>风险等级</h3><div class="score-value">中</div><div class="score-meta">景气波动可控</div></div></div>
      <section class="panel"><h3>复盘参数</h3><div class="panel-grid"><div class="form-group"><label>股票代码</label><input class="form-control" value="300750"></div><div class="form-group"><label>复盘类型</label><select class="form-control"><option>通用复盘</option></select></div><div class="form-group"><label>时间范围</label><select class="form-control"><option>近 30 天</option></select></div><div class="form-group"><label>结论偏好</label><select class="form-control"><option>纪律优先</option></select></div><button class="btn">生成复盘草案</button><button class="btn-light">保存复盘记录</button></div></section>
      <div class="content"><section class="section card"><h3>复盘结果</h3><div class="grid-2"><div class="form-group"><label>逻辑回顾</label><textarea>行业景气和龙头地位仍成立，买入逻辑并未破坏，当前位置仍处于可管理区间。</textarea></div><div class="form-group"><label>执行质量</label><textarea>首笔建仓纪律较好，但第二笔加仓前仍需等待价格与趋势确认，不宜提前动作。</textarea></div></div><div class="grid-2"><div class="form-group"><label>风险变化</label><textarea>盈利增速放缓和市场风格切换仍是主要风险，但暂未出现逻辑证伪信号。</textarea></div><div class="form-group"><label>后续动作建议</label><textarea>继续持有，跟踪补仓条件；若回到高估区可转入减仓观察。</textarea></div></div></section><section class="section"><h3>持仓复盘历史记录</h3><div class="record-grid"><div class="record-card"><h4>复盘 #HR-20260425-015</h4><div class="record-meta">结论：继续持有 · 标签：逻辑未变 · 创建时间：2026-04-25 10:18</div></div><div class="record-card"><h4>复盘 #HR-20260418-011</h4><div class="record-meta">结论：等待二次确认 · 标签：补仓条件未满足 · 创建时间：2026-04-18 19:28</div></div></div></section></div>
