<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>股票分析 - 交易决策中心</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#1f2937;min-height:100vh}
    .app-shell{max-width:1520px;margin:0 auto;padding:24px;display:grid;grid-template-columns:280px 1fr;gap:20px}.sidebar,.header,.card,.panel,.record-card,.score-card{background:rgba(255,255,255,.96);border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.12);backdrop-filter:blur(8px)}
    .sidebar{padding:20px 16px;position:sticky;top:20px;align-self:start;min-height:calc(100vh - 48px)} .brand{padding:8px 10px 18px;border-bottom:1px solid #e5e7eb;margin-bottom:18px}.brand h1{margin:0 0 6px;font-size:20px;color:#111827}.brand p{margin:0;font-size:12px;color:#6b7280;line-height:1.6}
    .tree-title{font-size:12px;font-weight:800;color:#6b7280;margin:18px 10px 10px;text-transform:uppercase;letter-spacing:.08em}.tree,.tree .children{list-style:none;margin:0;padding:0}.tree>li{margin-bottom:8px}.tree a{display:block;text-decoration:none;color:#374151;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:700}.tree a:hover{background:#f3f4f6}.tree a.active{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:#fff}.tree .children{margin:6px 0 0 18px;padding:0 0 0 12px;border-left:2px solid #e5e7eb}.tree .children a{font-size:13px;font-weight:600;color:#6b7280;padding:8px 10px}.tree .children a.current{background:#eef2ff;color:#4338ca}
    .header{padding:24px;margin-bottom:20px}.header h2{margin:0 0 8px;font-size:30px;color:#111827}.header p{margin:0;color:#6b7280;line-height:1.6}.score-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.score-card{padding:16px;color:#fff;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%)}.score-card h3{margin:0 0 10px;font-size:13px;font-weight:600;opacity:.92}.score-value{font-size:28px;font-weight:800}.score-meta{margin-top:4px;font-size:12px;opacity:.9}
    .panel{padding:20px;margin-bottom:20px}.panel h3,.content h3{margin:0 0 16px;font-size:20px;color:#111827}.panel-grid{display:grid;grid-template-columns:1.2fr repeat(2,minmax(0,1fr)) auto auto;gap:12px;align-items:end}.form-group{margin-bottom:16px}.panel-grid .form-group{margin-bottom:0}.form-group label{display:block;margin-bottom:8px;font-weight:600;color:#374151}.form-control,textarea,select{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:10px;font-size:14px;background:#fff}textarea{min-height:120px;resize:vertical}.btn,.btn-light{border:none;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn{width:100%;color:#fff;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%)}.btn-light{width:100%;color:#374151;background:#f3f4f6;border:1px solid #e5e7eb}
    .section{margin-bottom:20px}.card{padding:18px}.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.record-card{padding:18px}.record-card h4{margin:0 0 8px;font-size:16px}.record-meta{color:#6b7280;font-size:13px;line-height:1.7}
    @media (max-width:1280px){.app-shell{grid-template-columns:1fr}.sidebar{position:static;min-height:auto}.score-grid,.grid-2,.record-grid,.panel-grid{grid-template-columns:1fr 1fr}} @media (max-width:720px){.score-grid,.grid-2,.record-grid,.panel-grid{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="/static/ui/nav.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-page="stock-analysis-record"></aside>
    <main>
      <div class="header"><h2>股票分析</h2><p>用于对关注股票发起一次研究型分析记录，沉淀基本面、行业、财务、新闻、技术面和综合结论。</p></div>
      <div class="score-grid">
        <div class="score-card"><h3>当前标的</h3><div class="score-value">中国神华</div><div class="score-meta">601088 · 红利型</div></div>
        <div class="score-card"><h3>分析维度</h3><div class="score-value">6</div><div class="score-meta">基本面 / 财务 / 新闻 / 技术</div></div>
        <div class="score-card"><h3>情绪结论</h3><div class="score-value">中性偏稳</div><div class="score-meta">负面冲击有限</div></div>
        <div class="score-card"><h3>综合判断</h3><div class="score-value">继续跟踪</div><div class="score-meta">更适合防御配置</div></div>
      </div>
      <section class="panel">
        <h3>分析参数</h3>
        <div class="panel-grid">
          <div class="form-group"><label>股票代码</label><input class="form-control" value="601088"></div>
          <div class="form-group"><label>分析类型</label><select class="form-control"><option>综合分析</option></select></div>
          <div class="form-group"><label>分析模型</label><select class="form-control"><option>qwen3.5-n</option></select></div>
          <button class="btn">开始股票分析</button>
          <button class="btn-light">保存分析记录</button>
        </div>
      </section>
      <div class="content">
          <section class="section card">
            <h3>分析结果</h3>
            <div class="grid-2">
              <div class="form-group"><label>基本面摘要</label><textarea>煤炭龙头，现金流稳定，红利属性强，估值长期处于相对低位。</textarea></div>
              <div class="form-group"><label>行业与概念摘要</label><textarea>能源价格中枢仍有支撑，但行业景气上行弹性有限，更偏防守配置。</textarea></div>
            </div>
            <div class="grid-2">
              <div class="form-group"><label>财务与新闻摘要</label><textarea>盈利质量稳健，近期新闻以分红、产量和能源政策跟踪为主，扰动较小。</textarea></div>
              <div class="form-group"><label>技术面摘要</label><textarea>趋势平稳向上，但短期位置不算极低，更适合回调吸纳而不是追涨。</textarea></div>
            </div>
            <div class="form-group"><label>AI 综合结论</label><textarea>适合作为红利防守仓位持续跟踪，但当前价格并未显著低估，建议继续观察更优介入点。</textarea></div>
          </section>
          <section class="section">
            <h3>股票分析历史记录</h3>
            <div class="record-grid">
              <div class="record-card"><h4>分析 #AR-20260424-006</h4><div class="record-meta">类型：综合分析 · 结论：继续跟踪 · 创建时间：2026-04-24 20:11</div></div>
              <div class="record-card"><h4>分析 #AR-20260410-003</h4><div class="record-meta">类型：财务+技术分析 · 结论：适合防守配置 · 创建时间：2026-04-10 18:20</div></div>
            </div>
          </section>
        </div>
    </main>
  </div>
  <script src="/static/ui/nav.js"></script>
</body>
</html>
